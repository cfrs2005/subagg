# 一份典型的机场 Clash 订阅（结构真实，凭据全部为编造值）。
#
# 刻意包含了几处现实中会遇到的麻烦：
#   - 混入的"信息节点"（剩余流量 / 官网），需要被内置规则滤掉
#   - 看起来像数字的密码（YAML 会解析成 number，必须转回字符串）
#   - 老版本 Clash 的 ws-path / ws-headers 写法
#   - 上游自带的 proxy-groups 与 rules（我们应当忽略它们）

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: '🇺🇸美国 | 霍格沃茨特快列车'
    type: vless
    server: train.hogwarts.example
    port: 443
    uuid: 11111111-2222-3333-4444-555555555555
    network: tcp
    udp: true
    tls: true
    servername: www.microsoft.com
    client-fingerprint: chrome
    flow: xtls-rprx-vision
    reality-opts:
      public-key: cHVibGljLWtleS1wbGFjZWhvbGRlcg
      short-id: 6ba85179

  - name: '🇭🇰香港｜海格的小屋'
    type: vmess
    server: 45.202.199.14
    port: 57337
    uuid: 66666666-7777-8888-9999-000000000000
    alterId: 0
    cipher: auto
    network: ws
    udp: true
    ws-opts:
      path: /hagrid
      headers:
        Host: cdn.hogwarts.example

  # 老版本 Clash 的写法：ws-path / ws-headers 平铺在顶层
  - name: '🇯🇵 JP-Legacy-Style'
    type: vmess
    server: jp-legacy.example.com
    port: 443
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    alterId: 0
    cipher: auto
    network: ws
    tls: true
    ws-path: /legacy
    ws-headers:
      Host: jp-legacy.example.com

  - name: '🇭🇰 HK-Premium-01 IEPL'
    type: trojan
    server: hk1.premium.example.com
    port: 443
    password: trojan-password-01
    sni: hk1.premium.example.com
    udp: true

  # 密码是纯数字 —— YAML 会解析成 number，必须转回字符串，
  # 否则生成出的配置里密码类型不对，客户端认证失败
  - name: '🇸🇬 SG-Numeric-Password'
    type: ss
    server: sg1.premium.example.com
    port: 8388
    cipher: aes-256-gcm
    password: 12345678

  - name: '🇩🇪 DE-Hysteria2'
    type: hysteria2
    server: de.example.com
    port: 443
    password: hy2-password
    sni: de.example.com
    obfs: salamander
    obfs-password: obfs-secret
    up: '100 mbps'
    down: '200 mbps'

  # 以下两条是机场塞进来的"信息节点"，不是真节点
  - name: '剩余流量：87.32 GB'
    type: ss
    server: info.example.com
    port: 1
    cipher: aes-256-gcm
    password: placeholder

  - name: '官网：https://example.com'
    type: ss
    server: info.example.com
    port: 2
    cipher: aes-256-gcm
    password: placeholder

# 上游自带的编排。聚合多个订阅后这些必然冲突，我们只取 proxies、
# 分组与规则由 subagg 自己按模板生成。
proxy-groups:
  - name: 上游的自动选择
    type: url-test
    proxies:
      - '🇺🇸美国 | 霍格沃茨特快列车'
      - '🇭🇰香港｜海格的小屋'
    url: http://www.gstatic.com/generate_204
    interval: 300

rules:
  - GEOIP,CN,DIRECT
  - MATCH,上游的自动选择
