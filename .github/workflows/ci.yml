name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 只读权限即可，CI 不需要写仓库
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 是原生模块，CI 上走预编译产物；
      # 若某版本无预编译包，npm 会回退源码编译，ubuntu-latest 自带工具链。
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
